<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta name="color-scheme" content="dark">
  <title>AI Office Float</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="tower" class="tower-window" hidden>
    <header id="tower-drag" class="tower-bar" aria-label="拖曳浮動樓層">
      <span class="drag-grip" aria-hidden="true">⠿</span>
      <span class="tower-icon" title="AI 玩偶辦公室" aria-hidden="true">
        <svg viewBox="0 0 18 14" width="15" height="12" fill="none" stroke="currentColor" stroke-width="1" stroke-linejoin="round">
          <path d="M9 1.6 16.4 5.2 9 8.8 1.6 5.2Z"/>
          <path d="M16.4 5.2v1.7L9 10.5 1.6 6.9V5.2"/>
          <path d="M9 8.8v1.7"/>
        </svg>
      </span>
      <span id="tower-truth" class="sr-only"></span>
      <div class="window-actions">
        <button id="tower-mode" type="button" title="切換動畫模式" aria-label="切換動畫模式">◌</button>
        <button id="tower-privacy" type="button" title="切換隱私遮罩" aria-label="切換隱私遮罩" aria-pressed="false">◐</button>
        <button id="tower-minimize" type="button" title="最小化" aria-label="最小化">−</button>
        <button id="tower-close" type="button" title="關閉" aria-label="關閉">×</button>
      </div>
    </header>
    <section id="owner-floor" class="owner-floor" aria-label="Owner 永久決策室"></section>
    <section id="tower-floors" class="tower-floors" aria-label="目前有用的 AI 工作樓層"></section>
    <div class="tower-grips" aria-hidden="true">
      <span class="tower-grip" data-grip="nw"></span>
      <span class="tower-grip" data-grip="n"></span>
      <span class="tower-grip" data-grip="ne"></span>
      <span class="tower-grip" data-grip="w"></span>
      <span class="tower-grip" data-grip="e"></span>
      <span class="tower-grip" data-grip="sw"></span>
      <span class="tower-grip" data-grip="s"></span>
    </div>
    <button id="tower-resize" class="tower-grip" data-grip="se" type="button" title="拖曳調整大小" aria-label="拖曳調整大小">↘</button>
    <p id="tower-message" class="sr-only" aria-live="polite"></p>
  </main>

  <script src="js/neutralino.js"></script>
  <script type="module" src="js/main.js?v=20260813-motion-runtime-13"></script>
</body>
</html>

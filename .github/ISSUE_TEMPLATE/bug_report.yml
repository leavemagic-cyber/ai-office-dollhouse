name: Bug report
description: Report a reproducible display, installer, or provider-integration problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve AI Office Dollhouse. Do not attach real prompts, transcripts, hook payloads, configuration files, API keys, account identifiers, or event-store files.
  - type: input
    id: version
    attributes:
      label: AI Office Dollhouse version
      placeholder: "0.3.9"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2"
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Provider involved
      options:
        - Codex
        - Claude
        - Gemini
        - Grok
        - Installer or desktop overlay
        - Multiple providers
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use synthetic names and data only.
      placeholder: |
        1. Start...
        2. Run...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed prompts, responses, secrets, account data, full paths, and raw session identifiers.
          required: true

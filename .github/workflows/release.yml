name: Publish Windows Release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release.yml
      - .github/release-notes/v*.md
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          package-manager-cache: true

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Test and build Windows package
        shell: pwsh
        run: ./scripts/package-release.ps1

      - name: Create or update GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          $notesPath = ".github/release-notes/$tag.md"
          $zipPath = "release/AI-Office-Dollhouse-$tag-win-x64.zip"
          $checksumAssetName = "$(Split-Path -Leaf $zipPath).sha256"

          if (-not (Test-Path -LiteralPath $notesPath)) {
            throw "Missing release notes: $notesPath"
          }
          if (-not (Test-Path -LiteralPath $zipPath)) {
            throw "Missing Windows package: $zipPath"
          }

          git ls-remote --exit-code --tags origin "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub tag does not exist: $tag"
          }

          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $tag `
              --repo $env:GITHUB_REPOSITORY `
              --title "AI Office Dollhouse $version" `
              --notes-file $notesPath `
              --latest
            if ($LASTEXITCODE -eq 0) {
              gh release upload $tag $zipPath `
                --repo $env:GITHUB_REPOSITORY `
                --clobber
            }
            if ($LASTEXITCODE -eq 0) {
              $assetNames = @(gh release view $tag `
                --repo $env:GITHUB_REPOSITORY `
                --json assets `
                --jq '.assets[].name')
              if ($LASTEXITCODE -eq 0 -and $assetNames -contains $checksumAssetName) {
                gh release delete-asset $tag $checksumAssetName `
                  --repo $env:GITHUB_REPOSITORY `
                  --yes
              }
            }
          }
          else {
            gh release create $tag $zipPath `
              --repo $env:GITHUB_REPOSITORY `
              --title "AI Office Dollhouse $version" `
              --notes-file $notesPath `
              --verify-tag `
              --latest
          }
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to create or update GitHub release $tag"
          }

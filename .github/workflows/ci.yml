name: Windows CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          package-manager-cache: true
      - name: Install locked dependencies without dependency lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Package and verify the pinned Windows release
        shell: pwsh
        run: ./scripts/package-release.ps1
